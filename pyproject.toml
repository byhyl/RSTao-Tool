[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RSTao-Tool"
dynamic = ["version"]
description = "遥感影像处理与矢量编辑集成系统"
license = {text = "Proprietary"}
authors = [{name = "byhyl"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
    "pycryptodome>=3.19.0",
    "shapely>=2.0.0",
    "wmi>=1.5.1",
    "pyproj>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "pyinstaller>=5.0",
]

gui = [
    "customtkinter>=5.2.0",
    "pyperclip>=1.8.0",
    "tkcalendar>=1.6.1",
]

vector = [
    "fiona>=1.9.0",
    "ezdxf>=1.1.0",
]

geo = [
    "rasterio>=1.3",
    "tifffile>=2023.7.0",
]

ml = [
    "onnxruntime>=1.16.0",
]

three-d = [
    "laspy>=2.5.0",
    "open3d>=0.18.0",
    "trimesh>=4.0.0",
]

app = [
    "customtkinter>=5.2.0",
    "pyperclip>=1.8.0",
    "tkcalendar>=1.6.1",
    "fiona>=1.9.0",
    "ezdxf>=1.1.0",
    "rasterio>=1.3",
    "tifffile>=2023.7.0",
    "onnxruntime>=1.16.0",
]

full = [
    "customtkinter>=5.2.0",
    "pyperclip>=1.8.0",
    "tkcalendar>=1.6.1",
    "fiona>=1.9.0",
    "ezdxf>=1.1.0",
    "rasterio>=1.3",
    "tifffile>=2023.7.0",
    "onnxruntime>=1.16.0",
    "laspy>=2.5.0",
    "open3d>=0.18.0",
    "trimesh>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "./config.py",
    "./config-3.py",
]

[tool.pyinstaller]
name = "RSTao-Tool"
onefile = false
windowed = true
icon = "assets/icon.ico"

[tool.setuptools]
py-modules = ["main", "auth", "activation_ui"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "common.version.__version__"}

[tool.setuptools.packages.find]
include = ["admin_tool*", "common*", "core*", "data*", "plugins*", "ui*"]
exclude = [
    "tests*",
    "server*",
    "logs*",
    "temp*",
    "build*",
    "dist*",
    "assets*",
    "installer*",
    "_admin_repo*",
]
