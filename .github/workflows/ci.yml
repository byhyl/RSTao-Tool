name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting
        run: |
          black --check --diff --line-length 100 --exclude "_admin_repo|tests|server" .
          isort --check-only --diff --profile black --skip _admin_repo --skip tests --skip server .
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name RSTao-Tool --icon icon.ico main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSTao-Tool
          path: dist/RSTao-Tool.exe