name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black isort pyinstaller

      - name: Check formatting
        run: |
          black --check --diff --line-length 100 --exclude "_admin_repo|tests|server" .
          isort --check-only --diff --profile black --skip _admin_repo --skip tests --skip server .
        continue-on-error: true

      - name: Run tests
        run: |
          mkdir logs -Force
          pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --collect-data customtkinter --hidden-import wmi --hidden-import pythoncom --hidden-import matplotlib.backends.backend_tkagg --hidden-import shapely --hidden-import fiona --name RSTao-Tool --icon assets/icon.ico --add-data "i18n;i18n" --add-data "assets;assets" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSTao-Tool
          path: dist/RSTao-Tool.exe