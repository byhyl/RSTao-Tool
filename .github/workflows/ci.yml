name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app,three-d]"

      - name: Check formatting
        run: |
          black --check --diff --line-length 100 --exclude "_admin_repo|tests|server|build|dist|temp" .
          isort --check-only --diff --profile black --skip _admin_repo --skip tests --skip server --skip build --skip dist --skip temp .

      - name: Run tests with coverage
        run: |
          mkdir logs -Force
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
