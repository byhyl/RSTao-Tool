name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Run tests
        run: |
          mkdir logs -Force
          pytest tests/ -v --tb=short

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed `
            --collect-data customtkinter `
            --collect-data pyproj `
            --hidden-import wmi `
            --hidden-import pythoncom `
            --hidden-import matplotlib.backends.backend_tkagg `
            --hidden-import shapely `
            --hidden-import fiona `
            --hidden-import pyproj `
            --hidden-import rasterio `
            --hidden-import onnxruntime `
            --collect-data rasterio `
            --collect-submodules rasterio `
            --name RSTao-Tool `
            --icon assets/icon.ico `
            --add-data "i18n;i18n" `
            --add-data "assets;assets" `
            main.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found"
          }
          & $iscc installer\setup.iss

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @("dist\RSTao-Tool.exe")
          $assets += Get-ChildItem "installer\RSTao-Tool-Setup-*.exe" | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets `
              --title "RSTao-Tool $tag" `
              --notes "Windows installer and executable built by GitHub Actions."
          }
